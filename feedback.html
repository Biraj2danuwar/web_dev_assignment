<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="feedback.html">Feedback</a></div>
    <div class="main-content">
        <div class="content-box">
            <h1>Feedback Form</h1>
            <form action="submit" method="post">

                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Enter your username">
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="example@gmail.com">
                <br><br>

                <p class="highlight">Rating Section</p>
                <input type="radio" name="rating"> Very Satisfied
                <input type="radio" name="rating"> Satisfied
                <input type="radio" name="rating"> Neutral
                <input type="radio" name="rating"> Unsatisfied<br><br>

                <p>Interest Section</p>
                <input type="checkbox"> Web Development <br><br>
                <input type="checkbox"> Mobile Development <br><br>
                <input type="checkbox"> AI & Machine Learning<br><br>

                <label for="countries">Country Selection</label><br>
                <select id="countries">
                    <option>Choose Country</option>
                    <option>Nepal</option>
                    <option>USA</option>
                    <option>China</option></select>
                <br><br>
                <label for="message">Write your feedback here:</label>
                <br><textarea id="message" rows="5" cols="30"></textarea><br><br>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
